services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatorhub_ai
      POSTGRES_USER: creatorhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
      - creatorhub_ai_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorhub -d creatorhub_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://creatorhub:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/creatorhub_ai
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-this-before-use-123456}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  creatorhub_ai_data:
